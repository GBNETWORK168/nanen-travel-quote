<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="tq-build" content="115/10/14 00:58">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>旅平險組合方案試算報價系統</title>
<link rel="icon" type="image/png" href="img/favicon.png?v=20261014005831">
<link rel="apple-touch-icon" href="img/favicon.png?v=20261014005831">
<link rel="stylesheet" href="css/style.css?v=20261014005831">
<link rel="stylesheet" href="css/editor.css?v=20261014005831">
</head>
<body class="editor-body">
<header class="ed-top">
  <div class="ed-brand"><img class="ed-logo" src="img/logo.png?v=20261014005831" alt="南恩通訊處 大心" width="44" height="44"><span class="ed-brand-text"><span class="ed-slogan">台南最大心，服務最用心</span><span class="ed-title"><b>旅平險組合方案試算報價系統</b><span class="ed-internal">內部使用・請勿傳給客戶</span></span></span></div>
  <div class="ed-actions">
    <button type="button" class="btn btn-gold btn-plan" id="btnPlanPng0">⬇ 方案一下載</button>
    <button type="button" class="btn btn-gold btn-plan" id="btnPlanPng1">⬇ 方案二下載</button>
    <button type="button" class="btn btn-gold btn-plan" id="btnPlanPng2">⬇ 方案三下載</button>
    <button type="button" class="btn btn-gold" id="btnSummaryPng">🖼 三方案總圖下載</button>
    <button type="button" class="btn" id="btnSample">載入範例</button>
    <button type="button" class="btn btn-ghost" id="btnClear">清空金額</button>
  </div>
</header>


<div class="ed-layout">
  <form class="ed-form" id="form" autocomplete="off" onsubmit="return false">
    <section class="ed-card ed-user">
      <h2>使用者 <small>（必填・只用於內部使用紀錄，不會出現在報價圖或客戶頁；本機會記住，下次不用再填）</small></h2>
      <div class="ed-user-row">
        <div class="ed-unit"><span class="ed-unit-lbl">單位</span><span class="ed-unit-val" id="userUnit">南恩通訊處</span></div>
        <label>業務員姓名（必填）<input type="text" id="userName" maxlength="20" placeholder="例：陳銘旭" autocomplete="off" aria-describedby="userWarn"></label>
        <label>職稱（必填）<input type="text" id="userTitle" maxlength="20" placeholder="例：業務經理" autocomplete="off" list="userTitleList" aria-describedby="userWarn"></label>
        <datalist id="userTitleList"><option value="業務經理"><option value="業務襄理"><option value="業務主任"><option value="業務專員"><option value="處經理"><option value="區經理"></datalist>
        <span class="dest-warn" id="userWarn" role="alert" hidden></span>
      </div>
    </section>
    <section class="ed-card">
      <h2>行程資料 <small>（頁首只顯示：目的地、天數、日期；不顯示年齡）</small></h2>
      <div class="grid g2">
        <label>目的地<input type="text" data-k="destination" placeholder="例：日本／法國（申根）" aria-describedby="destWarn"><span class="dest-warn" id="destWarn" role="alert" hidden></span></label>
        <label>被保險人年齡（足歲・必填）<input type="number" min="0" max="100" step="1" data-k="age" inputmode="numeric" placeholder="例：35（不會顯示在客戶頁）" aria-describedby="ageWarn ageHint"><span class="dest-warn" id="ageWarn" role="alert" hidden></span><span class="hint" id="ageHint"></span></label>
        <label>生日（選填・自動算足歲）<input type="text" data-k="birthday" maxlength="12" inputmode="numeric" placeholder="民國 71/08/07、710807 或西元 1982-08-07" autocomplete="off" aria-describedby="bdayHint"><span class="hint" id="bdayHint">填生日自動帶入足歲（以出發日計，未填出發日以今天計）；改年齡會清除生日</span></label>
        <div class="date-row">
          <label>出發日<input type="date" data-k="startDate"></label>
          <label class="time-pick">出發時間（24h）<span class="time-sel"><select data-k="startHour" aria-label="出發時"><option value="">--</option><option value="00">00</option><option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option></select> : <select data-k="startMin" aria-label="出發分"><option value="00">00</option><option value="30">30</option></select></span></label>
          <label>回程日<input type="date" data-k="endDate"><span class="hint" id="endTimeHint">回程時間＝出發時間</span></label>
          <div class="days-auto" id="daysAuto" aria-live="polite"><span class="days-auto-lbl">天數（依日期自動）</span><span class="days-auto-val" id="daysAutoVal"></span></div>
          <span class="dest-warn" id="dateWarn" role="alert" hidden></span>
        </div>
        <label>日期顯示
          <select data-k="dateFormat"><option value="roc">民國（115/10/13）</option><option value="ad">西元（2026/10/13）</option></select>
        </label>
      </div>
      <details class="prop-advanced" style="margin-top:10px">
        <summary>行程進階（OH1 地區%、年齡帶、人壽查表地區）</summary>
        <div class="grid g2" style="margin-top:8px">
          <label>人壽 OH1 地區限額調整
            <select data-k="lifeRegionPct"></select>
            <span class="hint" id="regionHint"></span>
          </label>
          <label>人壽費率類型
            <select data-k="lifeRateType">
              <option value="agency">旅行社／快易保費率</option>
            </select>
          </label>
          <label>人壽旅遊地區（查表用）
            <select data-k="lifeRegion">
              <option value="asia14">國外亞洲14國（可附 OAA）</option>
              <option value="other">國外其他</option>
            </select>
            <span class="hint">申根勾選時會自動改為「國外其他」</span>
          </label>
          <label>年齡區間（依上方年齡自動・客戶頁不顯示）
            <select data-k="ageBand" disabled>
              <option value="18-65">18足歲～65歲</option>
              <option value="15-17">15足歲～17歲</option>
              <option value="66-70">66～70歲</option>
              <option value="71-75">71～75歲</option>
              <option value="76-80">76～80歲</option>
              <option value="81-100">81～100歲</option>
              <option value="under15">未滿15足歲</option>
            </select>
          </label>
        </div>
      </details>
      <label class="schengen-toggle">
        <input type="checkbox" data-k="schengen">
        <span>
          <span class="st-title">🇪🇺 申根行程（產險改用計畫二）</span>
          <span class="st-desc">勾選後產險自動改為「新快樂旅綜+ 計畫二（醫療加值／申根適用）」：海外突發疾病住院固定 <b>150萬</b>，保額仍依下方各方案「產險保額」。人壽視為國外其他（無 OAA），離線表無費率，需 GPTA 手填。</span>
          <span class="hint auto" id="schengenAutoHint" hidden>已依目的地自動勾選申根</span>
        </span>
      </label>
      <label class="schengen-toggle card-toggle">
        <input type="checkbox" data-k="propertyProductCard">
        <span>
          <span class="st-title">💳 新快樂旅平卡專案（產險改用旅平卡組合）</span>
          <span class="st-desc">勾選後產險保費與保障改用「富邦產險 新快樂旅平卡（專案）」計劃二（國外旅遊）／計劃三（醫療加值／申根）組合7～17，費率為 115年專案費率表（含法定傳染病）；可在各方案選組合。僅 2～30 天有費率。</span>
          <span id="cardAddonBox" class="card-addons" hidden>
            <label class="check"><input type="checkbox" data-k="cardAddons.activity"> 加價購：特定活動（0～80歲）</label>
            <label class="check"><input type="checkbox" data-k="cardAddons.carRental"> 加價購：海外租車（18～75歲，限駕駛人本人）</label>
          </span>
        </span>
      </label>
      <p class="hint" id="autoPremiumBanner" style="margin:10px 0 0;padding:8px 10px;background:#eef6ff;border-radius:8px;color:#173c66"></p>
      <label class="check sample-check"><input type="checkbox" data-k="sample"> 標示為「範例資料」（客戶頁會出現紅色「範例」標記；正式報價請取消勾選）</label>
    </section>

    <div class="plan-tabs" id="planTabs"></div>
    <div id="planForms"></div>

    <section class="ed-card">
      <h2>附註（選填）</h2>
      <textarea data-k="extraNotesText" rows="3" placeholder="每行一則，會加在頁尾附註"></textarea>
      <h2 style="margin-top:14px">簽名</h2>
      <div class="grid g2">
        <label>通訊處<input type="text" data-k="agent.unit"></label>
        <label>業務員<input type="text" data-k="agent.name"></label>
        <label>職稱<input type="text" data-k="agent.title"></label>
      </div>
    </section>

    <section class="ed-card checks" id="checks" hidden aria-hidden="true"></section><!-- 送出前檢查：依需求不顯示（擋報價仍由下載鈕 alert 處理） -->
  <p class="build-ver" id="buildVersion">版本 115/10/14 00:58</p>
  </form>

  <aside class="ed-preview">
    <div class="pv-bar">
      <span>即時預覽</span>
      <div class="pv-toggle">
        <button type="button" class="on" data-w="390">手機 390px</button>
        <button type="button" data-w="full">桌機</button>
      </div>
    </div>
    <div class="pv-scroll"><div class="pv-frame" id="pvFrame"><div class="app" id="preview"></div></div></div>
  </aside>
</div>

<script src="js/vendor/pako.min.js?v=20261014005831"></script>
<script src="js/vendor/html2canvas.min.js?v=20261014005831"></script>
<script src="js/config.js?v=20261014005831"></script>
<script src="js/usage-log.js?v=20261014005831"></script>
<script src="js/common.js?v=20261014005831"></script>
<script src="js/sample-data.js?v=20261014005831"></script>
<script src="js/presets.js?v=20261014005831"></script>
<script src="js/xinkuaile-card.js?v=20261014005831"></script>
<script src="js/life-rates.js?v=20261014005831"></script>
<script src="js/summary-export.js?v=20261014005831"></script>
<script src="js/editor.js?v=20261014005831"></script>
</body>
</html>
